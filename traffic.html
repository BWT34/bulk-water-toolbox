<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellington Traffic Alerts</title>
<style>
body{
    margin:0;
    padding:20px;
    background:#f3f4f6;
    font-family:'Segoe UI',sans-serif;
}
h1{
    text-align:center;
    color:#08122f;
    margin-bottom:20px;
}
.card{
    background:#08122f;
    color:white;
    padding:16px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.card h3{
    margin-top:0;
    margin-bottom:10px;
}
.type{
    font-weight:bold;
    margin-bottom:8px;
}
.region{
    color:#94a3b8;
    margin-bottom:8px;
}
</style>
</head>
<body>
<h1>Wellington Traffic Alerts</h1>
<div id="traffic"></div>
<script>
// Your deployed Cloudflare Worker proxying the NZTA traffic feed —
// same one used on the weather page.
const WORKER_URL = 'https://bwt-traffic-proxy.bulkwatertransport.workers.dev';

fetch(WORKER_URL)
.then(response => response.json())
.then(data => {
    const events = data.response.roadevent.filter(event => {
        if (event.status !== 'Active')
            return false;
        if (event.eventIsland !== 'North Island')
            return false;
        const region =
            (event.region?.name || '').toUpperCase();
        return region === 'WELLINGTON';
    });
    const container = document.getElementById('traffic');
    if (events.length === 0) {
        container.innerHTML = `
            <div class="card">
                No active Wellington traffic events.
            </div>
        `;
        return;
    }
    events.forEach(event => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <h3>${event.locationArea}</h3>
            <div class="type">${event.eventType}</div>
            <div>${event.impact || ''}</div>
            <div class="region">${event.region?.name || ''}</div>
            <div>${(event.eventComments || '').substring(0,200)}...</div>
        `;
        container.appendChild(card);
    });
})
.catch(error => {
    document.getElementById('traffic').innerHTML = `
        <div class="card">
            Error loading traffic data.
        </div>
    `;
    console.error(error);
});
</script>
</body>
</html>
