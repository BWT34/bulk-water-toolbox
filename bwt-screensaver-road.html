<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BWT Road Screensaver</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #050b1f; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #clock { position: fixed; color: #fff; font: 300 clamp(18px, 2.4vw, 40px) "Segoe UI", Arial, sans-serif;
           text-shadow: 0 2px 10px rgba(0,0,0,.6); transition: opacity 1.2s ease; letter-spacing: .02em; }
  #clock small { display: block; font-size: .5em; font-weight: 400; opacity: .85; letter-spacing: .08em; text-transform: uppercase; }
  #clock.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"></div>

<script>
(function () {
  // ---- Settings ----
  const SHOW_CLOCK = true;        // small clock in a corner (moves every minute)
  const SUNRISE = 6.25;           // sunrise, in hours (6.25 = 6:15 am) - adjust through the year
  const SUNSET = 19.5;            // sunset (19.5 = 7:30 pm). Late October in the Hutt Valley is about 6:15 and 7:55 on the clock
  const CYCLE_SECONDS = 180;      // one full day-and-night cycle takes this long (dusk, night, dawn, day). 0 = follow the real clock
  const TRUCK_X = 0.36;           // where the water truck sits across the screen (0.5 = middle; smaller = further left, more room for oncoming traffic)
  const SPEEDING_KMH = 105;       // a speed check at or over this sends two police cars after the truck
  const POLICE_SECONDS = 300;     // (only used by the ?police=1 test mode)
  const MILK_SECONDS = 25;        // a Bulk Milk truck comes past about this often
  const SPEED = 240;              // how fast the truck "drives" (pixels per second on a 900 px tall screen)
  const PLACES = ['Wellington', 'Porirua', 'Kapiti', 'Otaki', 'Levin', 'Featherston', 'Greytown',
                  'Carterton', 'Masterton', 'Martinborough', 'Palmerston North', 'Feilding', 'Upper Hutt'];
  // Testing: add ?hour=14 to the address to freeze the time of day, or ?fast=1 to watch a whole day go by

  const params = new URLSearchParams(location.search);
  const forcedHour = params.has('hour') ? parseFloat(params.get('hour')) : null;
  const fast = params.has('fast');
  const CYC = params.has('cycle') ? parseFloat(params.get('cycle')) : CYCLE_SECONDS;   // testing: ?cycle=24 runs the day in 24 seconds
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, s = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); s = H / 900;
  }
  resize(); addEventListener('resize', resize);

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const rgb = (c, al) => al === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- time of day ----------
  function hours(t) {
    let h;
    if (forcedHour === null && !fast && !params.has('real') && CYC > 0) {
      // Speeded-up day: the sky steps through day, dusk, night and dawn so the headlights get seen.
      // Hours here are the sky's own (6 = sunrise, 18 = sunset, 30 = next sunrise).
      const p = ((t / 1000 / CYC) + 0.28) % 1;          // start late in the afternoon
      const seg = [[0, .34, 8, 16.5], [.34, .46, 16.5, 19], [.46, .84, 19, 29.5], [.84, 1, 29.5, 32]];
      for (const [a, b, h0, h1] of seg) if (p >= a && p < b) return h0 + (h1 - h0) * (p - a) / (b - a);
      return 8;
    }
    if (forcedHour !== null) h = forcedHour;
    else if (fast) h = (6 + t / 1000 * 0.6) % 24;
    else { const d = new Date(); h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
    // Stretch the day to match your sunrise and sunset (the sky code assumes 6 am to 6 pm)
    const dayLen = SUNSET - SUNRISE, since = ((h - SUNRISE) % 24 + 24) % 24;
    return since <= dayLen ? 6 + since / dayLen * 12 : 18 + (since - dayLen) / (24 - dayLen) * 12;
  }

  // ---------- world ----------
  const HORIZON = 0.60;
  const layers = [
    { f: 0.04, base: 0.585, P: 3000, day: [124, 156, 190], night: [20, 30, 56],
      waves: [[2, .020, 0], [5, .012, 1.3], [9, .006, 2.2]] },
    { f: 0.12, base: 0.655, P: 2600, day: [70, 124, 96], night: [12, 36, 42],
      waves: [[3, .022, .6], [7, .010, 2.1], [11, .005, .4]] },
    { f: 0.40, base: 0.705, P: 2200, day: [54, 132, 66], night: [10, 38, 28],
      waves: [[2, .012, 1.1], [6, .008, .3], [13, .003, 2.7]] }
  ];
  function ridge(L, x) {
    let v = 0; for (const [k, a, p] of L.waves) v += a * Math.sin(2 * Math.PI * k * x / L.P + p);
    return (L.base - v) * H;
  }
  const turbines = [260, 760, 1330, 1900, 2350];
  const trees = Array.from({ length: 46 }, () => ({ x: rnd() * 2200, h: 40 + rnd() * 60, w: 0.45 + rnd() * 0.2 }));
  const stars = Array.from({ length: 140 }, () => ({ x: rnd(), y: rnd() * 0.55, r: .4 + rnd() * 1.2, p: rnd() * 6 }));
  const clouds = Array.from({ length: 8 }, () => ({ x: rnd() * 2400, y: 0.06 + rnd() * 0.30, sc: .7 + rnd() * 1.1, sp: 4 + rnd() * 8 }));
  const birds = [];

  let ourWave = 0, milkWave = 0;   // how far each driver's hand is raised
  let ourFlash = 0, milkFlash = 0;   // indicators blinking while the trucks pass
  let policeX = null, policeTimer = params.has('police') ? 1500 : 40000;
  const POLICE_EVERY = (params.has('police') ? 9 : POLICE_SECONDS) * 1000;
  let milkX = null, milkTimer = params.has('milk') ? 1500 : 5000;   // the oncoming Bulk Milk truck
  const MILK_EVERY = (params.has('milk') ? 9 : MILK_SECONDS) * 1000;
  let sc = 0;                     // distance travelled
  const parts = [];               // smoke, dust, drips
  const signs = [];
  let signTimer = 6000, signIdx = 0;
  if (params.has('board')) { signIdx = 2; signTimer = 300; }   // testing: show the logo billboard first

  // ---------- sky ----------
  function drawSky(h, t) {
    const alt = Math.sin(Math.PI * (h - 6) / 12);
    const day = smooth(-0.14, 0.28, alt), night = 1 - day;
    const tw = Math.exp(-Math.pow(alt / 0.22, 2));
    let top = mix([8, 14, 40], [58, 135, 220], day);
    let bot = mix([18, 34, 74], [170, 218, 250], day);
    top = mix(top, [88, 70, 140], tw * 0.45);
    bot = mix(bot, [255, 150, 90], tw * 0.75);
    const g = ctx.createLinearGradient(0, 0, 0, HORIZON * H);
    g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars
    if (night > 0.05) for (const st of stars) {
      const tw2 = 0.6 + 0.4 * Math.sin(t * 0.002 + st.p);
      ctx.fillStyle = `rgba(255,255,255,${(night * tw2 * 0.9).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r * Math.max(.8, s), 0, 7); ctx.fill();
    }
    // sun
    const sunT = (h - 6) / 12;
    if (sunT > -0.1 && sunT < 1.1) {
      const x = W * (0.08 + 0.84 * sunT), y = HORIZON * H - Math.sin(Math.PI * sunT) * H * 0.46;
      const r = 46 * s;
      const gl = ctx.createRadialGradient(x, y, r * .2, x, y, r * 4.5);
      gl.addColorStop(0, 'rgba(255,236,170,.75)'); gl.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
      ctx.fillStyle = tw > 0.5 ? '#ffd59a' : '#fff7d6'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    // moon
    const moonT = (((h - 18) % 24) + 24) % 24 / 12;
    if (moonT < 1.1 || moonT > 1.9) {
      const mt = moonT > 1.9 ? moonT - 2 : moonT;
      const x = W * (0.08 + 0.84 * mt), y = HORIZON * H - Math.sin(Math.PI * clamp(mt, 0, 1)) * H * 0.42;
      const r = 34 * s;
      const gl = ctx.createRadialGradient(x, y, r * .5, x, y, r * 4);
      gl.addColorStop(0, 'rgba(190,210,255,.35)'); gl.addColorStop(1, 'rgba(190,210,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
      ctx.fillStyle = '#e8eefc'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(150,165,200,.45)';
      [[-.3, -.2, .22], [.25, .1, .28], [-.1, .4, .16]].forEach(c => { ctx.beginPath(); ctx.arc(x + c[0] * r, y + c[1] * r, c[2] * r, 0, 7); ctx.fill(); });
    }
    return { day, night, tw };
  }

  function drawClouds(dt, light) {
    const col = mix([70, 80, 110], [255, 255, 255], light.day);
    const warm = mix(col, [255, 190, 150], light.tw * .6);
    for (const c of clouds) {
      c.x -= c.sp * dt / 1000 * s * 3 * (1 + windAmt * 2.5);
      const px = ((c.x - sc * 0.02) % 2400 + 2400) % 2400 * W / 2400 - 160 * s;
      const y = c.y * H, k = c.sc * s;
      ctx.fillStyle = rgb(warm, 0.85 * (0.45 + 0.55 * light.day) + 0.1);
      ctx.beginPath();
      [[0, 0, 40], [38, -14, 46], [84, 0, 38], [46, 12, 44], [10, 14, 30], [74, 14, 30]]
        .forEach(([dx, dy, r]) => { ctx.moveTo(px + dx * k + r * k, y + dy * k); ctx.arc(px + dx * k, y + dy * k, r * k, 0, 7); });
      ctx.fill();
    }
  }

  // a distant aeroplane with a faint trail; its lights blink at night
  let plane = null, planeTimer = params.has('plane') ? 800 : 25000;
  function drawPlane(dt, t, light) {
    planeTimer -= dt;
    if (!plane && planeTimer <= 0) {
      const dir = Math.random() < .5 ? 1 : -1;
      plane = { x: dir > 0 ? -80 * s : W + 80 * s, dir, y: (0.08 + Math.random() * 0.16) * H, trail: [] };
      planeTimer = (60 + Math.random() * 60) * 1000;
    }
    if (!plane) return;
    plane.x += plane.dir * 38 * s * dt / 1000 * 1.0;
    const x = plane.x, y = plane.y - (x / W) * 12 * s * plane.dir * 0;
    if (!reduceMotion) { plane.trail.push([x, y]); if (plane.trail.length > 160) plane.trail.shift(); }
    const n = plane.trail.length;
    for (let i = 0; i < n; i += 2) {
      const a = (i / n) * 0.35 * (0.3 + light.day * 0.7);
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(plane.trail[i][0] - plane.dir * 4 * s, plane.trail[i][1] + 1 * s, (1 + i / n * 1.4) * s, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.translate(x, y); ctx.scale(plane.dir * s, s);
    ctx.fillStyle = mixc(light);
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 2.3, 0, 0, 7); ctx.fill();                       // body
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-9, 8); ctx.lineTo(-5, 8); ctx.lineTo(4, 0); ctx.fill(); // wing
    ctx.beginPath(); ctx.moveTo(-12, -1); ctx.lineTo(-16, -7); ctx.lineTo(-13, -7); ctx.lineTo(-8, -1); ctx.fill(); // tail
    if (light.night > 0.3) {
      const on = Math.sin(t * 0.006) > 0.2;
      ctx.fillStyle = on ? '#ff3b30' : '#661510'; ctx.beginPath(); ctx.arc(-1, 6, 1.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; if (Math.sin(t * 0.02) > 0.8) { ctx.beginPath(); ctx.arc(-15, -6, 1.6, 0, 7); ctx.fill(); }
    }
    ctx.restore();
    if ((plane.dir > 0 && x > W + 120 * s) || (plane.dir < 0 && x < -120 * s)) plane = null;
  }
  function mixc(light) { return rgb(mix([150, 160, 185], [250, 250, 252], light.day), 1); }

  // shooting stars: only in the night sky, each with a glowing head and a fading tail
  const METEOR_SECONDS = 7;       // one streaks past about this often at night
  const meteors = [];
  function drawMeteors(dt, light) {
    if (light.night > 0.6 && meteors.length < 3 && Math.random() < dt / (METEOR_SECONDS * 1000)) {
      const dir = Math.random() < .5 ? 1 : -1, ang = (0.18 + Math.random() * 0.3);
      meteors.push({ x: (dir > 0 ? Math.random() * .6 : .4 + Math.random() * .6) * W, y: (0.04 + Math.random() * 0.28) * H,
                     dx: dir * Math.cos(ang), dy: Math.sin(ang), v: (520 + Math.random() * 360) * s, life: 0, max: 0.9 + Math.random() * 0.7 });
    }
    ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i]; m.life += dt / 1000;
      m.x += m.dx * m.v * dt / 1000; m.y += m.dy * m.v * dt / 1000;
      const f = m.life / m.max; if (f >= 1) { meteors.splice(i, 1); continue; }
      const a = Math.min(1, f * 6, (1 - f) * 2.5) * Math.min(1, (light.night - 0.5) * 3);
      const L = 170 * s, tx = m.x - m.dx * L, ty = m.y - m.dy * L;
      const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')');
      g.addColorStop(0.3, 'rgba(180,210,255,' + (0.5 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(120,160,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2.6 * s; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
      const h = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 9 * s);
      h.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')'); h.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = h; ctx.beginPath(); ctx.arc(m.x, m.y, 9 * s, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // potholes: the odd one in our lane; each wheel that drops into it gives the truck a jolt
  const POTHOLE_SECONDS = 22;     // a pothole comes along about this often
  const potholes = [];
  let potTimer = params.has('pothole') ? 600 : 12000, potBounce = 0, potVel = 0;
  const WHEELS = [462, 217, 127];                      // front, middle, rear wheel positions on the truck
  function updatePotholes(dt, v, x0, yG, light) {
    potTimer -= dt;
    if (potTimer <= 0) { potholes.push({ x: W + 90 * s, w: (34 + Math.random() * 22) * s, hit: [0, 0, 0] }); potTimer = POTHOLE_SECONDS * 1000 * (0.6 + Math.random() * 0.8); }
    for (let i = potholes.length - 1; i >= 0; i--) {
      const p = potholes[i]; p.x -= v * dt / 1000;
      if (p.x < -120 * s) { potholes.splice(i, 1); continue; }
      WHEELS.forEach((lx, k) => { if (!p.hit[k] && p.x <= x0 + lx * s * TS) { p.hit[k] = 1; potVel += k === 0 ? 0.16 : 0.10; } });
      const y = yG + 3 * s + hillY(p.x);
      ctx.fillStyle = rgb(mix([46, 50, 58], [10, 12, 18], light.night)); ctx.beginPath(); ctx.ellipse(p.x, y, p.w, 7 * s, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(140,145,155,' + (0.35 - light.night * 0.2).toFixed(2) + ')'; ctx.lineWidth = 1.6 * s; ctx.beginPath(); ctx.ellipse(p.x, y, p.w, 7 * s, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    }
    // damped spring: the truck settles back after each jolt
    potVel += (-0.0007 * potBounce - 0.011 * potVel) * dt; potBounce += potVel * dt;
  }

  // school kids at the roadside in daylight: they wave, and our driver waves back and flashes his indicators
  const KIDS_SECONDS = 45;        // a group of kids comes along about this often (daylight only)
  let kidGroup = null, kidsTimer = params.has('kids') ? 800 : 18000, kidWave = 0;
  const KID_COLS = [['#1d3a6e', '#e9c46a'], ['#7a1f2b', '#2a9d8f'], ['#1f5a3a', '#e76f51'], ['#4a4f5a', '#f4a261'], ['#1d3a6e', '#c1121f']];
  const HAIR = ['#2b1d12', '#6b4423', '#c9a23c', '#111', '#8a3b12'], SKINS = ['#f0c4a0', '#e0a98a', '#c98f6b', '#a86f4c'];
  function updateKids(dt, t, v, light) {
    kidsTimer -= dt;
    if (!kidGroup && !radar && kidsTimer <= 0 && light.day > 0.7) {
      const n = 2 + (Math.random() * 3 | 0);
      kidGroup = { x: W + 80 * s, kids: Array.from({ length: n }, (_, i) => ({
        dx: i * (40 + Math.random() * 14) * s, sc: .88 + Math.random() * .18, col: KID_COLS[Math.random() * KID_COLS.length | 0],
        hair: HAIR[Math.random() * HAIR.length | 0], skin: SKINS[Math.random() * SKINS.length | 0], hat: Math.random() < .5, ph: Math.random() * 6 })) };
      const g = kidGroup, lastK = g.kids[g.kids.length - 1];
      g.dog = { dx: lastK.dx + (44 + Math.random() * 6) * s, fur: ['#d9a05b', '#3a2a20', '#c9c2b8', '#8a5a2b'][Math.random() * 4 | 0] };   // a dog sits beside the last kid
      kidsTimer = KIDS_SECONDS * 1000 * (0.7 + Math.random() * 0.6);
    }
    kidWave = 0;
    if (!kidGroup) return;
    kidGroup.x -= v * dt / 1000;                      // same speed as the road: they stand on the far side
    const last = kidGroup.dog.dx;
    if (kidGroup.x + last < -120 * s) { kidGroup = null; return; }
    // the group waves as the truck approaches them and the driver answers
    const ourCab = W * TRUCK_X - 274 * s * TS + 485 * s * TS, mid = kidGroup.x + last / 2;
    kidWave = 1 - smooth(120 * s, 520 * s, Math.abs(mid - ourCab - 300 * s));
    if (kidWave > 0.03) {
      ourWave = Math.max(ourWave, kidWave);
      if (kidWave > 0.3) ourFlash = Math.max(ourFlash, Math.sin(t * 0.0125) > 0 ? 1 : 0);
    }
  }
  const UMB = ['#e63946', '#ffd23f', '#2a9d8f', '#7b2cbf', '#ff7a14', '#2b6fd6'];
  function drawKids(t) {
    if (!kidGroup) return;
    const by = roadTop() - 2 * s;                              // far side of the road, on the grass beyond the white line
    for (const k of kidGroup.kids) {
      const x = kidGroup.x + k.dx, y = by + hillY(x), amt = kidWave, bob = Math.abs(Math.sin(t * 0.008 + k.ph)) * 1.5 * amt;
      ctx.save(); ctx.translate(x, y - bob); ctx.scale(s * k.sc * 0.74, s * k.sc * 0.74);
      const lean = windAmt * 0.16 + Math.sin(t * 0.011 + k.ph) * windAmt * 0.04;      // blown sideways in a gust
      ctx.transform(1, 0, lean, 1, 0, 0);
      ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, bob, 17, 4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = k.col[1]; ctx.beginPath(); ctx.roundRect(-18, -62, 12, 30, 4); ctx.fill();                       // school bag
      ctx.fillStyle = k.skin; ctx.fillRect(-8, -26, 6, 22); ctx.fillRect(2, -26, 6, 22);                                 // legs
      ctx.fillStyle = '#f3f3f3'; ctx.fillRect(-8, -13, 6, 8); ctx.fillRect(2, -13, 6, 8);                                // socks
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(-6, -2, 6.5, 3.4, 0, 0, 7); ctx.ellipse(6, -2, 6.5, 3.4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#4a4f5a'; ctx.fillRect(-11, -34, 22, 12);                                                         // shorts / skirt
      ctx.fillStyle = k.col[0]; ctx.beginPath(); ctx.roundRect(-12, -62, 24, 32, 6); ctx.fill();                          // jumper
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-5, -62); ctx.lineTo(0, -55); ctx.lineTo(5, -62); ctx.closePath(); ctx.fill();
      ctx.lineCap = 'round'; ctx.lineWidth = 5;
      ctx.strokeStyle = k.col[0]; ctx.beginPath(); ctx.moveTo(-11, -58); ctx.lineTo(-14, -39); ctx.stroke();            // arm by the side
      ctx.fillStyle = k.skin; ctx.beginPath(); ctx.arc(-14, -36, 3.4, 0, 7); ctx.fill();
      const sw = Math.sin(t * 0.016 + k.ph) * 6 * amt, hx = 14 + 9 * amt + sw, hy = -38 - 48 * amt;                      // waving arm
      ctx.strokeStyle = k.col[0]; ctx.beginPath(); ctx.moveTo(11, -58); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = k.skin; ctx.beginPath(); ctx.arc(hx, hy - 2, 3.8, 0, 7); ctx.fill();
      ctx.fillRect(-3, -68, 6, 7);                                                                                        // neck
      ctx.beginPath(); ctx.arc(0, -76, 9.6, 0, 7); ctx.fill();                                                           // head
      ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(0, -78, 9.8, Math.PI * 1.03, Math.PI * 1.97); ctx.closePath(); ctx.fill();
      if (windAmt > 0.04) {                                                                                               // hair streaming sideways
        ctx.strokeStyle = k.hair; ctx.lineCap = 'round'; ctx.lineWidth = 3.2;
        for (let q = 0; q < 4; q++) {
          const len = (7 + q * 2.5) * (0.4 + windAmt * 1.4), fl = Math.sin(t * 0.03 + q * 1.7 + k.ph) * 3.2 * windAmt;
          ctx.beginPath(); ctx.moveTo(-5 + q * 3.2, -86.5 + q * 1.4); ctx.quadraticCurveTo(-5 + q * 3.2 - len * 0.5, -88 + q * 1.4 + fl, -5 + q * 3.2 - len, -85 + q * 2 + fl * 1.5); ctx.stroke();
        }
      }

      ctx.fillStyle = rgb(mix([255, 255, 255], [238, 242, 248], light.night));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${29 * s}px Arial, sans-serif`;
      ctx.fillText(sg.name.toUpperCase(), x + w / 2, top + h * .40);
      ctx.font = `${15 * s}px Arial, sans-serif`;
      ctx.fillText('Bulk water delivered', x + w / 2, top + h * .74);
      spots(x, top, w, h, light.night, s);

  function wheel(cx, cy, rot) {
    ctx.fillStyle = '#12161c'; ctx.beginPath(); ctx.arc(cx, cy, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#242a33'; ctx.beginPath(); ctx.arc(cx, cy, 28, 0, 7); ctx.fill();
    const rim = ctx.createRadialGradient(cx - 6, cy - 6, 2, cx, cy, 20);
    rim.addColorStop(0, '#f1f4f8'); rim.addColorStop(1, '#8f9aa8');
    ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a5360'; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#39414d';
    for (let k = 0; k < 8; k++) {
      const a = rot + k * Math.PI / 4;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 13, cy + Math.sin(a) * 13, 2.4, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(40,48,60,.5)'; ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) { const a = rot + k * Math.PI / 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 8, cy + Math.sin(a) * 8); ctx.lineTo(cx + Math.cos(a) * 19, cy + Math.sin(a) * 19); ctx.stroke(); }
  }

  function crescent(cx, cy, R, c1, c2, rot) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot || 0); ctx.scale(R, R);
    const g = ctx.createLinearGradient(-1, -1, .4, 1); g.addColorStop(0, c1); g.addColorStop(1, c2);

    ctx.bezierCurveTo(-.95, .8, -.95, -.8, .35, -.95); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function waveMark(cx, cy, R, c1, c2) {
    crescent(cx, cy, R, c1, c2, 0);

    crescent(cx + R * .24, cy - R * .02, R * .44, c1, c2, -.15);
    crescent(cx + R * .34, cy + R * .24, R * .32, c2, c1, .1);

    // light bar on the roof
    ctx.fillStyle = '#222a33'; ctx.fillRect(116, -112, 66, 9);
    ctx.fillStyle = flip ? '#ff3b3b' : '#6a1414'; ctx.fillRect(118, -111, 30, 7);
    ctx.fillStyle = flip ? '#10306f' : '#3d8bff'; ctx.fillRect(150, -111, 30, 7);

    // lights, bumpers
    ctx.fillStyle = night > .3 ? '#fff6c8' : '#f1e8b4'; ctx.beginPath(); ctx.roundRect(290, -56, 9, 9, 3); ctx.fill();
    ctx.fillStyle = '#e0242b'; ctx.fillRect(2, -58, 6, 8);
    ctx.fillStyle = '#2a323d'; ctx.fillRect(0, -34, 8, 8); ctx.fillRect(292, -34, 8, 8);
    // wheels
    ctx.fillStyle = '#10141a'; [62, 238].forEach(cx => { ctx.beginPath(); ctx.arc(cx, -22, 27, Math.PI, 0); ctx.fill(); });
    [62, 238].forEach(cx => { ctx.save(); ctx.translate(cx, -21); ctx.scale(.62, .62); wheel(0, 0, rot); ctx.restore(); });

    // flare from the lights and the headlights at night
    ctx.globalCompositeOperation = 'lighter';
    const fl = (x, col) => { const g = ctx.createRadialGradient(x, -107, 1, x, -107, 62); g.addColorStop(0, `rgba(${col},.95)`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, -107, 62, 0, 7); ctx.fill(); };
    if (flip) fl(133, '255,50,50'); else fl(165, '60,130,255');
    if (night > 0.25) {
      const bm = ctx.createLinearGradient(299, 0, 900, 0); bm.addColorStop(0, `rgba(255,240,170,${(.5 * night).toFixed(3)})`); bm.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = bm; ctx.beginPath(); ctx.moveTo(299, -52); ctx.lineTo(900, -100); ctx.lineTo(900, 10); ctx.lineTo(299, -46); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  // ---------- particles ----------
  function spawn(type, x, y, vx, vy, life, r) { parts.push({ type, x, y, vx, vy, life, max: life, r }); }
  let tExh = 0, tDust = 0, tDrip = 400;
  function updateParts(dt, x0, yG, v) {
    tExh -= dt; tDust -= dt; tDrip -= dt;
    if (tExh <= 0) { tExh = 90; spawn('smoke', x0 + 407 * s * TS, yG - 208 * s * TS, -v * .55 + (Math.random() - .5) * 20 * s, -(28 + Math.random() * 18) * s, 2400, 7 * s); }
    if (tDust <= 0) { tDust = 120; spawn('dust', x0 + (100 + Math.random() * 60) * s * TS, yG - 6 * s, -v * .8, -(6 + Math.random() * 10) * s, 1100, 6 * s); }
    // the water leaks according to the road: pours out the back going uphill, stops going downhill, random drops on the flat
    const xc = x0 + 294 * s * TS, half = 168 * s * TS, slope = (hillY(xc - half) - hillY(xc + half)) / (2 * half);   // positive = climbing
    const rearLift = hillY(x0 + 10 * s * TS);
    if (tDrip <= 0) {
      if (slope > 0.02) {                                                                // uphill: a steady stream, thicker the steeper it is
        const f = Math.min(1, slope / 0.12);
        tDrip = 95 - 55 * f;
        spawn('drip', x0 + 8 * s * TS, yG - 64 * s * TS + rearLift, -v + (Math.random() - .5) * 30 * s, -(10 + Math.random() * 20) * s, 5000, (3.6 + 1.2 * f) * s);
      } else if (slope < -0.02) {                                                        // downhill: nothing comes out
        tDrip = 150;
      } else {                                                                           // flat: the occasional drop
        tDrip = 350 + Math.random() * 700;
        spawn('drip', x0 + 10 * s * TS, yG - 62 * s * TS + rearLift, -v, 0, 5000, 3.2 * s);
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      const k = dt / 1000;
      if (p.type === 'drip') {
        p.vy += 1500 * s * k; p.x += p.vx * k; p.y += p.vy * k;
        const gy = yG + 2 * s + hillY(p.x);
        if (p.y >= gy) { p.type = 'splash'; p.life = p.max = 500; p.y = gy; p.vx = -v; }
      } else { p.x += p.vx * k; p.y += p.vy * k; if (p.type === 'smoke') p.r += 6 * s * k; if (p.type === 'dust') p.r += 9 * s * k; }
    }
  }
  function drawParts(light) {
    for (const p of parts) {
      const a = p.life / p.max;
      if (p.type === 'smoke') { ctx.fillStyle = `rgba(${light.night > .5 ? '120,130,150' : '150,155,160'},${(a * .35).toFixed(3)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      else if (p.type === 'dust') { ctx.fillStyle = `rgba(${light.night > .5 ? '90,95,110' : '190,180,160'},${(a * .35).toFixed(3)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      else if (p.type === 'drip') { ctx.fillStyle = 'rgba(120,200,255,.95)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * .8, p.r * 1.5, 0, 0, 7); ctx.fill(); }
      else if (p.type === 'splash') { ctx.strokeStyle = `rgba(150,215,255,${(a * .8).toFixed(3)})`; ctx.lineWidth = 1.6 * s; ctx.beginPath(); ctx.ellipse(p.x, p.y, (1 - a) * 16 * s + 2 * s, (1 - a) * 4 * s + 1, 0, 0, 7); ctx.stroke(); }
    }
  }

  // ---------- clock ----------
  const clockEl = document.getElementById('clock');
  if (!SHOW_CLOCK) clockEl.style.display = 'none';
  const corners = [['auto', '3%', '4%', 'auto'], ['3%', 'auto', '4%', 'auto'], ['3%', 'auto', 'auto', '4%'], ['auto', '3%', 'auto', '4%']]; // top,right? see place()
  let corner = 0;
  function placeClock(fade) {
    const set = () => {
      const c = [[{ top: '3%', right: '3%' }], [{ top: '3%', left: '3%' }], [{ bottom: '3%', left: '3%' }], [{ bottom: '3%', right: '3%' }]][corner++ % 4][0];
      clockEl.style.top = clockEl.style.bottom = clockEl.style.left = clockEl.style.right = 'auto';
      Object.assign(clockEl.style, c); clockEl.classList.remove('hide');
    };
    if (fade) { clockEl.classList.add('hide'); setTimeout(set, 1300); } else set();
  }
  placeClock(false); setInterval(() => placeClock(true), 60000);
  function tickClock() {
    const d = new Date(), hh = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2, '0');
    clockEl.innerHTML = hh + ':' + mm + ' ' + (d.getHours() < 12 ? 'am' : 'pm') +
      '<small>' + d.toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' }) + '</small>';
  }
  tickClock(); setInterval(tickClock, 1000);

  // ---------- main loop ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(64, t - last); last = t;
    const vNom = SPEED * s * (reduceMotion ? 0.5 : 1);
    const v = updateSignal(dt, vNom);       // the truck's real speed: it slows and stops for the temporary traffic lights
    sc += v * dt / 1000 / s * s;          // world distance in screen pixels

    const h = hours(t);
    const light = drawSky(h, t);
    drawClouds(dt, light);
    updateWind(dt);
    updateHills(dt, v);
    rainCover = updateRain(dt);
    updateSnow(dt);
    drawRainClouds(t);
    drawBirds(dt, t, light);
    drawMeteors(dt, light);
    drawPlane(dt, t, light);
    drawSanta(dt, t, light);
    drawLayer(0, light, t); drawLayer(1, light, t); drawLayer(2, light, t);

    // verge behind the road (above it) is part of the near hill; draw road, then signs, truck
    drawSnowSky();
    drawRoad(light);

    signTimer -= dt;
    if (signTimer <= 0) { signTimer = 26000; signs.push(signIdx % 3 === 2 ? (signIdx++, { x: W + 40, board: true }) : { x: W + 40, name: PLACES[signIdx++ % PLACES.length] }); }
    for (let i = signs.length - 1; i >= 0; i--) { signs[i].x -= v * dt / 1000; if (signs[i].x < -420 * s) signs.splice(i, 1); }
    drawSigns(light);
    updateRadar(dt, v);
    updateWorks(dt, v, light);
    updateBroke(dt, v, light);
    drawKids(t);                                                 // far side of the road, behind the trucks
    drawRadar(t, light);

    // oncoming Bulk Milk truck in the far lane, about once a minute
    milkTimer -= dt;
    if (milkX === null && milkTimer <= 0) { milkCount++; milkKind = pickKind(); milkX = W + (KIND_LEN(milkKind) * s * TM) + 10; milkTimer = MILK_EVERY + (Math.random() - .5) * MILK_EVERY * 0.3; }
    ourWave = milkWave = ourFlash = milkFlash = 0;
    if (santaNear > 0.03) { ourWave = Math.max(ourWave, santaNear); if (santaNear > 0.45) ourFlash = Math.sin(t * 0.006) > 0 ? 1 : 0; }   // our driver waves and indicates back at Santa
    if (bdWave > 0.03) { ourWave = bdWave; if (bdWave > 0.3) ourFlash = Math.sin(t * 0.0125) > 0 ? 1 : 0; }
    if (milkX !== null) {
      milkX -= (v + 0.65 * vNom) * dt / 1000;            // oncoming traffic keeps moving while we wait
      const yFar = 0.797 * H;
      // both drivers wave while the two cabs are alongside each other
      const ourCab = W * TRUCK_X - 274 * s * TS + 485 * s * TS, milkCab = milkX - KIND_CAB(milkKind) * s * TM - (milkKind !== 'milk' ? 150 * s : 0);   // hydro cab is shorter: wave while its driver can still be seen
      const near = 1 - smooth(150 * s, 330 * s, Math.abs(ourCab - milkCab));
      ourWave = Math.max(ourWave, near); milkWave = clamp(near * 1.15, 0, 1);
      if (near > 0.3) { ourFlash = milkFlash = Math.sin(t * 0.0125) > 0 ? 1 : 0; }   // both blink their indicators
      const half = KIND_LEN(milkKind) / 2, drawFn = milkKind === 'hydro' ? drawHydroTruck : milkKind === 'flat' ? drawFlatTruck : drawMilkTruck;
      onHill(milkX - half * s * TM, (half - 90) * s * TM, yFar, () => drawFn(milkX, yFar, t, light));
      if (milkX < -20 * s) milkX = null;
    }

    // police car: same lane and direction as the milk truck, fast, waits until the lane is clear
    policeTimer -= dt;
    if (policeX === null && milkX === null && (policePending || (params.has('police') && policeTimer <= 0))) {
      policePending = false;
      policeX = W + (POLICE_LEN * s * TP) + 10; policeTimer = POLICE_EVERY + (Math.random() - .5) * POLICE_EVERY * 0.2;
    }
    if (policeX !== null) {
      policeX -= (v + 1.7 * vNom) * dt / 1000;
      const gap = POLICE_LEN * s * TP * 1.45;                  // two cars, one close behind the other
      const yP = 0.797 * H, hp = 110 * s * TP, cp = 150 * s * TP;
      onHill(policeX + gap - cp, hp, yP, () => drawPoliceCar(policeX + gap, yP, t, light, 130));
      onHill(policeX - cp, hp, yP, () => drawPoliceCar(policeX, yP, t, light, 0));
      if (policeX + gap < -20 * s) policeX = null;
    }

    // police motorbike: far lane, quick, waits for the lane to be clear
    motoTimer -= dt;
    if (motoX === null && motoTimer <= 0 && milkX === null && policeX === null) {
      motoX = W + MOTO_LEN * s * TB + 10; motoTimer = MOTO_SECONDS * 1000 * (0.7 + Math.random() * 0.6);
    }
    if (motoX !== null) {
      motoX -= (v + 2.0 * vNom) * dt / 1000;
      const yM = 0.797 * H;
      onHill(motoX - 62 * s * TB, 46 * s * TB, yM, () => drawPoliceBike(motoX, yM, t, light));
      if (motoX < -20 * s) motoX = null;
    }

    const x0 = W * TRUCK_X - 274 * s * TS, yG = 0.855 * H;
    updateKids(dt, t, v, light);
    updatePotholes(dt, v, x0, yG, light);
    updateParts(dt, x0, yG, v);
    drawParts(light);
    onHill(x0 + 294 * s * TS, 168 * s * TS, yG, () => drawTruck(x0, yG, t, light));
    drawRain(dt);
    drawSnow(dt, t);
    drawWind(dt);
    drawVerge(light);
    drawWorks(t);
    drawVan(t);
    drawSignal(t);
    if (braking) {                                               // brake lights
      const bx2 = x0 + 4 * s * TS, by2 = yG - 77 * s * TS; ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(bx2, by2, 1, bx2, by2, 34 * s); g.addColorStop(0, 'rgba(255,40,30,.95)'); g.addColorStop(1, 'rgba(255,40,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx2, by2, 34 * s, 0, 7); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
    }
    drawBroke(t, light);
    if (giggle > 0) {                                            // speech bubble over our driver
      giggle -= dt;
      const a = clamp(Math.min(giggle / 400, (3600 - giggle) / 250), 0, 1);
      const bx = x0 + 470 * s * TS, by = yG + hillY(bx) - 285 * s * TS + Math.sin(t * 0.012) * 1.5 * s, bw = 118 * s, bh = 44 * s;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.roundRect(bx - bw / 2, by - bh, bw, bh, 14 * s);
      ctx.moveTo(bx - 14 * s, by - 1 * s); ctx.lineTo(bx - 2 * s, by + 22 * s); ctx.lineTo(bx + 8 * s, by - 1 * s);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillRect(bx - 12 * s, by - 3 * s, 18 * s, 4 * s);
      ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold ' + (24 * s) + 'px Arial, sans-serif';
      ctx.fillText('hehehe', bx, by - bh / 2 + 1 * s); ctx.restore();
    }

    // soft night darkening over everything for mood
    if (light.night > 0.01) { ctx.fillStyle = `rgba(2,6,20,${(light.night * 0.10).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Press F or double-click for full screen when running in a normal browser window
  function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') fs(); });
  addEventListener('dblclick', fs);
})();
</script>
</body>
