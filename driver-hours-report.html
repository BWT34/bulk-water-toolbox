<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Hours Report</title>

<style>
body{
    margin:0;
    padding:20px;
    box-sizing:border-box;
    font-family:-apple-system, Arial, sans-serif;
    color:white;
    min-height:100vh;
    position:relative;
}

.bg-fixed{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:-1;

    background:
        linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
        url('trucks.jpg');

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}

@media (max-width:768px){
    .bg-fixed{
        background:
            linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
            url('Trucks2.jpg');
        background-size:120%;
        background-position:center 10%;
        background-repeat:no-repeat;
    }
}

.back-link{
    position:fixed;
    top:20px;
    left:20px;
    z-index:100000;

    padding:8px 16px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:14px;

    color:white;
    font-weight:600;
    text-decoration:none;

    box-shadow:0 4px 16px rgba(0,0,0,0.2);
}

.back-link:hover{
    background:rgba(255,255,255,0.25);
}

.title{
    text-align:center;
    margin:70px auto 20px auto;
    padding:14px;
    max-width:700px;

    font-size:18px;
    font-weight:600;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;

    box-shadow:0 8px 32px rgba(0,0,0,0.25);
}

.report-card{
    max-width:700px;
    margin:0 auto 40px auto;

    padding:16px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;

    box-shadow:0 8px 32px rgba(0,0,0,0.25);

    overflow-x:auto;
}

.report-card iframe{
    display:block;
    width:641px;
    max-width:100%;
    height:658px;
    border:0;
    border-radius:12px;
    background:white;
}
</style>
</head>

<body>

<div class="bg-fixed"></div>

<a class="back-link" href="Thirdly.html">← Back to Management Forms</a>

<div class="title">
    📊 Driver Hours Report
</div>

<div class="report-card">
    <iframe width="641" height="658" frameborder="0" scrolling="no" src="https://bulkwatertransport.sharepoint.com/sites/BulkWaterTransport/_layouts/15/Doc.aspx?sourcedoc={30e4518f-cba6-4997-9770-69c0dd318d3f}&action=embedview&wdAllowInteractivity=False&Item=Chart%201&wdDownloadButton=True&wdInConfigurator=True&wdInConfigurator=True"></iframe>
</div>

</body>
</html>
