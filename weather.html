<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Water Weather</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f3f4f6;
    font-family:'Segoe UI',sans-serif;
}

#bwt-weather{
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

</style>
</head>
<body>

<div id="bwt-weather"></div>

<script>

function weatherIcon(code){

    switch(code){

        case 0: return '☀️';
        case 1: return '🌤️';
        case 2: return '⛅';
        case 3: return '☁️';

        case 45:
        case 48:
            return '🌫️';

        case 51:
        case 53:
        case 55:
            return '🌦️';

        case 56:
        case 57:
            return '🌧️';

        case 61:
        case 63:
        case 65:
            return '🌧️';

        case 66:
        case 67:
            return '🌧️';

        case 71:
        case 73:
        case 75:
        case 77:
            return '❄️';

        case 80:
        case 81:
        case 82:
            return '🌦️';

        case 85:
        case 86:
            return '🌨️';

        case 95:
        case 96:
        case 99:
            return '⛈️';

        default:
            return '☁️';
    }

}

async function loadWeather(){

    const panel = document.getElementById('bwt-weather');

    panel.innerHTML = '';

    const locations = [
        { name:'Upper Hutt', lat:-41.125, lon:175.070 },
        { name:'Wellington', lat:-41.2866, lon:174.7762 },
        { name:'Porirua', lat:-41.133, lon:174.840 },
        { name:'Hutt Valley', lat:-41.210, lon:174.910 },
        { name:'Kāpiti', lat:-40.900, lon:175.000 },
        { name:'Wairarapa', lat:-41.150, lon:175.450 }
    ];

    for(const loc of locations){

        try{

            const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1`;

            const data = await fetch(url).then(r => r.json());

            const currentTemp =
                Math.round(data.current.temperature_2m);

            const wind =
                Math.round(data.current.wind_speed_10m);

            const maxTemp =
                Math.round(data.daily.temperature_2m_max[0]);

            const minTemp =
                Math.round(data.daily.temperature_2m_min[0]);

            const icon =
                weatherIcon(data.current.weather_code);

            const card = document.createElement('div');

            card.style.background = '#08122f';
            card.style.color = 'white';
            card.style.borderRadius = '16px';
            card.style.padding = '18px';
            card.style.boxShadow =
                '0 4px 12px rgba(0,0,0,.25)';

            card.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                ">

                    <div>

                        <div style="
                            font-size:20px;
                            font-weight:600;
                            margin-bottom:8px;
                        ">
                            ${loc.name}
                        </div>

                        <div style="
                            font-size:32px;
                            margin-bottom:8px;
                        ">
                            ${icon}
                        </div>

                        <div style="
                            font-size:14px;
                            color:#cbd5e1;
                        ">
                            💨 ${wind} km/h
                        </div>

                        <div style="
                            font-size:14px;
                            color:#94a3b8;
                        ">
                            ↑${maxTemp}°
                            ↓${minTemp}°
                        </div>

                    </div>

                    <div style="
                        font-size:60px;
                        font-weight:300;
                        line-height:1;
                    ">
                        ${currentTemp}°
                    </div>

                </div>
            `;

            panel.appendChild(card);

        }
        catch(err){

            console.error(
                'Weather error:',
                loc.name,
                err
            );

        }

    }

}
function getUserLocation() {
    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
            reject('Geolocation not supported');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position => {
                resolve({
                    lat: position.coords.latitude,
                    lon: position.coords.longitude
                });
            },
            error => reject(error),
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 300000
            }
        );

    });
}
loadWeather();
async function loadWeather(){

    const panel = document.getElementById('bwt-weather');

    panel.innerHTML = '';

    let locations = [];

    try {

        const userLocation = await getUserLocation();

        locations.push({
            name: '📍 Your Location',
            lat: userLocation.lat,
            lon: userLocation.lon
        });

    } catch(err){

        console.log('Location unavailable');

    }

    locations.push(
        { name:'Upper Hutt', lat:-41.125, lon:175.070 },
        { name:'Wellington', lat:-41.2866, lon:174.7762 },
        { name:'Porirua', lat:-41.133, lon:174.840 },
        { name:'Hutt Valley', lat:-41.210, lon:174.910 },
        { name:'Kāpiti', lat:-40.900, lon:175.000 },
        { name:'Wairarapa', lat:-41.150, lon:175.450 }
    );

    // existing loop continues...
}
setInterval(loadWeather, 900000);

</script>

</body>
</html>
