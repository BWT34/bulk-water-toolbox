<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Water Weather</title>

<style>

body{
    margin:0;
    padding:80px 20px 20px 20px;
    box-sizing:border-box;
    background:#f3f4f6;
    font-family:'Segoe UI',sans-serif;
}

.back-link{
    position:fixed;
    top:20px;
    left:20px;
    z-index:100000;

    padding:8px 16px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(0,0,0,0.15);
    border-radius:14px;

    color:#08122f;
    font-weight:600;
    text-decoration:none;

    box-shadow:0 4px 16px rgba(0,0,0,0.15);
}

.back-link:hover{
    background:rgba(255,255,255,0.35);
}

#bwt-weather{
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.bwt-warning{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#dc2626;
    color:white;
    padding:8px 10px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-top:10px;
}

.bwt-traffic{
    display:flex;
    align-items:flex-start;
    gap:6px;
    background:#d97706;
    color:white;
    padding:8px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    margin-top:10px;
    text-align:left;
}

.bwt-traffic .bwt-traffic-detail{
    font-weight:400;
    text-transform:none;
    letter-spacing:normal;
}

.bwt-legend{
    max-width:420px;
    margin:16px auto 0 auto;
    font-size:11px;
    color:#6b7280;
    text-align:center;
}

</style>
</head>
<body>

<a class="back-link" href="index.html">← Back to Toolbox</a>

<div id="bwt-weather"></div>

<script>

function weatherIcon(code){

    switch(code){

        case 0: return '☀️';
        case 1: return '🌤️';
        case 2: return '⛅';
        case 3: return '☁️';

        case 45:
        case 48:
            return '🌫️';

        case 51:
        case 53:
        case 55:
            return '🌦️';

        case 56:
        case 57:
            return '🌧️';

        case 61:
        case 63:
        case 65:
            return '🌧️';

        case 66:
        case 67:
            return '🌧️';

        case 71:
        case 73:
        case 75:
        case 77:
            return '❄️';

        case 80:
        case 81:
        case 82:
            return '🌦️';

        case 85:
        case 86:
            return '🌨️';

        case 95:
        case 96:
        case 99:
            return '⛈️';

        default:
            return '☁️';
    }

}

// ---- Informal advisory badges ----
// NOT official MetService/government warnings — just sensible
// thresholds derived from the same forecast data already being
// fetched, flagged clearly as advisory-only so nobody mistakes
// these for an authoritative alert.
function getWarnings(wind, code, minTemp){

    const warnings = [];

    if(wind >= 70){
        warnings.push({ icon:'⚠️', text:'Severe Wind' });
    } else if(wind >= 50){
        warnings.push({ icon:'⚠️', text:'Wind' });
    }

    if([95,96,99].includes(code)){
        warnings.push({ icon:'⚠️', text:'Thunderstorm' });
    }

    if([65,67,82,86].includes(code)){
        warnings.push({ icon:'⚠️', text:'Heavy Rain' });
    }

    if([45,48].includes(code)){
        warnings.push({ icon:'⚠️', text:'Fog' });
    }

    if(minTemp <= 2){
        warnings.push({ icon:'❄️', text:'Frost Risk' });
    }

    return warnings;

}

// ---- Traffic integration ----
// Your deployed Cloudflare Worker proxying the NZTA traffic feed.
const TRAFFIC_WORKER_URL = 'https://bwt-traffic-proxy.bulkwatertransport.workers.dev';

// NZTA's regions are coarser than our per-city cards — Wellington,
// Porirua, Hutt Valley, Upper Hutt, and Kāpiti all share one broad
// "WELLINGTON" region tag, while Wairarapa is genuinely separate.
// So for the Wellington-area cities we also require the town's name
// to actually appear in the event's own location text, rather than
// showing every Wellington-region event on every one of those cards.
const WELLINGTON_AREA_CITIES = ['Wellington', 'Porirua', 'Hutt Valley', 'Upper Hutt', 'Kāpiti'];

// Some events genuinely affect Wairarapa-bound travel (the Remutaka
// Hill route in particular) but get tagged region=WELLINGTON since
// that's where the road starts. Catch those by also checking for
// Wairarapa town names or the pass itself in the event's own text.
const WAIRARAPA_KEYWORDS = ['WAIRARAPA', 'FEATHERSTON', 'GREYTOWN', 'CARTERTON', 'MASTERTON', 'REMUTAKA', 'RIMUTAKA'];

function normalizeRegion(name){
    return (name || '')
        .toUpperCase()
        .replace(/[ĀĂĄ]/g,'A').replace(/[ĒĔĖĘĚ]/g,'E')
        .replace(/[ĪĬĮİ]/g,'I').replace(/[ŌŎŐ]/g,'O')
        .replace(/[ŪŬŮŰŲ]/g,'U')
        .replace(/['’\-]/g,' ')
        .replace(/\s+/g,' ')
        .trim();
}

async function fetchTrafficEvents(){

    try{

        const data = await fetch(TRAFFIC_WORKER_URL).then(r => r.json());

        return (data.response.roadevent || []).filter(event => {
            if(event.status !== 'Active') return false;
            if(event.eventIsland !== 'North Island') return false;
            return true;
        });

    }
    catch(err){

        console.log('Traffic fetch error:', err);
        return [];

    }

}

function findTrafficForCity(cityName, events){

    const cityNorm = normalizeRegion(cityName);

    for(const event of events){

        const region = normalizeRegion(event.region?.name);
        const haystack = normalizeRegion(`${event.locationArea || ''} ${event.eventComments || ''}`);

        if(cityNorm === 'WAIRARAPA'){
            if(region === 'WAIRARAPA') return event;
            if(region === 'WELLINGTON' && WAIRARAPA_KEYWORDS.some(kw => haystack.includes(kw))) return event;
            continue;
        }

        if(WELLINGTON_AREA_CITIES.map(normalizeRegion).includes(cityNorm)){
            if(region === 'WELLINGTON' && haystack.includes(cityNorm)) return event;
            continue;
        }

        // Fallback for any other region — match on region name directly
        if(region === cityNorm) return event;

    }

    return null;

}

function buildCard(name, currentTemp, wind, maxTemp, minTemp, icon, isLocal, warnings, trafficEvent){

    const card = document.createElement('div');

    card.style.background = '#08122f';
    card.style.color = 'white';
    card.style.borderRadius = '16px';
    card.style.padding = '18px';
    card.style.boxShadow = '0 4px 12px rgba(0,0,0,.25)';

    if(isLocal){
        card.style.border = '2px solid #38bdf8';
    }

    const warningsHtml = (warnings || []).map(w => `
        <div class="bwt-warning">
            <span>${w.icon}</span>
            <span>${w.text}</span>
        </div>
    `).join('');

    let trafficHtml = '';

    if(trafficEvent){

        const location = trafficEvent.locationArea || trafficEvent.region?.name || 'Nearby';
        const truncated = location.length > 60 ? location.substring(0,60) + '…' : location;

        trafficHtml = `
            <div class="bwt-traffic">
                <span>🚧</span>
                <span>
                    DELAYS
                    <span class="bwt-traffic-detail"> · ${truncated}</span>
                </span>
            </div>
        `;

    }

    card.innerHTML = `
        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
        ">

            <div>

                <div style="
                    font-size:20px;
                    font-weight:600;
                    margin-bottom:8px;
                ">
                    ${isLocal ? '📍 ' : ''}${name}
                </div>

                <div style="
                    font-size:32px;
                    margin-bottom:8px;
                ">
                    ${icon}
                </div>

                <div style="
                    font-size:14px;
                    color:#cbd5e1;
                ">
                    💨 ${wind} km/h
                </div>

                <div style="
                    font-size:14px;
                    color:#94a3b8;
                ">
                    ↑${maxTemp}°
                    ↓${minTemp}°
                </div>

            </div>

            <div style="
                font-size:60px;
                font-weight:300;
                line-height:1;
            ">
                ${currentTemp}°
            </div>

        </div>
        ${warningsHtml}
        ${trafficHtml}
    `;

    return card;

}

function buildMessageCard(text){

    const card = document.createElement('div');

    card.style.background = '#1e293b';
    card.style.color = '#94a3b8';
    card.style.borderRadius = '16px';
    card.style.padding = '18px';
    card.style.fontSize = '14px';
    card.style.textAlign = 'center';

    card.textContent = text;

    return card;

}

async function fetchWeatherFor(lat, lon){

    const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1`;

    const data = await fetch(url).then(r => r.json());

    return {
        currentTemp: Math.round(data.current.temperature_2m),
        wind: Math.round(data.current.wind_speed_10m),
        maxTemp: Math.round(data.daily.temperature_2m_max[0]),
        minTemp: Math.round(data.daily.temperature_2m_min[0]),
        code: data.current.weather_code,
        icon: weatherIcon(data.current.weather_code)
    };

}

async function reverseGeocode(lat, lon){

    try{

        const url =
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;

        const data = await fetch(url).then(r => r.json());

        return data.locality
            || data.city
            || data.principalSubdivision
            || 'My Location';

    }
    catch(err){

        return 'My Location';

    }

}

function getBrowserLocation(){

    return new Promise((resolve, reject) => {

        if(!navigator.geolocation){
            reject(new Error('Geolocation not supported'));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos => resolve({
                lat: pos.coords.latitude,
                lon: pos.coords.longitude
            }),
            err => reject(err),
            {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 600000
            }
        );

    });

}

async function loadLocalCard(panel, trafficEvents){

    // Placeholder while we wait on the permission prompt / fetch
    const placeholder = buildMessageCard('Checking your location…');
    panel.appendChild(placeholder);

    try{

        const { lat, lon } = await getBrowserLocation();

        const [weather, name] = await Promise.all([
            fetchWeatherFor(lat, lon),
            reverseGeocode(lat, lon)
        ]);

        const warnings = getWarnings(weather.wind, weather.code, weather.minTemp);
        const trafficEvent = findTrafficForCity(name, trafficEvents);

        const card = buildCard(
            name,
            weather.currentTemp,
            weather.wind,
            weather.maxTemp,
            weather.minTemp,
            weather.icon,
            true,
            warnings,
            trafficEvent
        );

        panel.replaceChild(card, placeholder);

    }
    catch(err){

        console.error('Local weather error:', err);

        // err.code === 1 means the user denied the permission prompt
        const message = (err && err.code === 1)
            ? 'Location permission denied — showing default areas only'
            : 'Location unavailable — showing default areas only';

        panel.replaceChild(buildMessageCard(message), placeholder);

    }

}

async function loadWeather(){

    const panel = document.getElementById('bwt-weather');

    panel.innerHTML = '';

    // Fetch traffic once for the whole panel, rather than once per card
    const trafficEvents = await fetchTrafficEvents();

    // Local card goes first, and doesn't block the rest of the list
    await loadLocalCard(panel, trafficEvents);

    const locations = [
        { name:'Upper Hutt', lat:-41.125, lon:175.070 },
        { name:'Wellington', lat:-41.2866, lon:174.7762 },
        { name:'Porirua', lat:-41.133, lon:174.840 },
        { name:'Hutt Valley', lat:-41.210, lon:174.910 },
        { name:'Kāpiti', lat:-40.900, lon:175.000 },
        { name:'Wairarapa', lat:-41.150, lon:175.450 }
    ];

    for(const loc of locations){

        try{

            const weather = await fetchWeatherFor(loc.lat, loc.lon);
            const warnings = getWarnings(weather.wind, weather.code, weather.minTemp);
            const trafficEvent = findTrafficForCity(loc.name, trafficEvents);

            const card = buildCard(
                loc.name,
                weather.currentTemp,
                weather.wind,
                weather.maxTemp,
                weather.minTemp,
                weather.icon,
                false,
                warnings,
                trafficEvent
            );

            panel.appendChild(card);

        }
        catch(err){

            console.error(
                'Weather error:',
                loc.name,
                err
            );

        }

    }

    const legend = document.createElement('div');
    legend.className = 'bwt-legend';
    legend.textContent = '⚠️ weather · 🚧 traffic — alerts appear on the affected region when issued. Wind/rain/frost badges are advisory thresholds we set, not official MetService warnings.';
    panel.appendChild(legend);

}

loadWeather();

setInterval(loadWeather, 900000);

</script>

</body>
</html>
