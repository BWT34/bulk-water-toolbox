<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Water Weather</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f3f4f6;
    font-family:'Segoe UI',sans-serif;
}

#bwt-weather{
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.bwt-warning{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(239,68,68,0.15);
    border:1px solid rgba(239,68,68,0.4);
    color:#fecaca;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    margin-top:10px;
}

</style>
</head>
<body>

<div id="bwt-weather"></div>

<script>

function weatherIcon(code){

    switch(code){

        case 0: return '☀️';
        case 1: return '🌤️';
        case 2: return '⛅';
        case 3: return '☁️';

        case 45:
        case 48:
            return '🌫️';

        case 51:
        case 53:
        case 55:
            return '🌦️';

        case 56:
        case 57:
            return '🌧️';

        case 61:
        case 63:
        case 65:
            return '🌧️';

        case 66:
        case 67:
            return '🌧️';

        case 71:
        case 73:
        case 75:
        case 77:
            return '❄️';

        case 80:
        case 81:
        case 82:
            return '🌦️';

        case 85:
        case 86:
            return '🌨️';

        case 95:
        case 96:
        case 99:
            return '⛈️';

        default:
            return '☁️';
    }

}

// ---- Informal advisory badges ----
// NOT official MetService/government warnings — just sensible
// thresholds derived from the same forecast data already being
// fetched, flagged clearly as advisory-only so nobody mistakes
// these for an authoritative alert.
function getWarnings(wind, code, minTemp){

    const warnings = [];

    if(wind >= 70){
        warnings.push({ icon:'🌪️', text:'Very high wind (advisory)' });
    } else if(wind >= 50){
        warnings.push({ icon:'💨', text:'High wind (advisory)' });
    }

    if([95,96,99].includes(code)){
        warnings.push({ icon:'⛈️', text:'Thunderstorm risk (advisory)' });
    }

    if([65,67,82,86].includes(code)){
        warnings.push({ icon:'🌧️', text:'Heavy rain/snow (advisory)' });
    }

    if([45,48].includes(code)){
        warnings.push({ icon:'🌫️', text:'Fog — reduced visibility (advisory)' });
    }

    if(minTemp <= 2){
        warnings.push({ icon:'🥶', text:'Frost/ice risk overnight (advisory)' });
    }

    return warnings;

}

function buildCard(name, currentTemp, wind, maxTemp, minTemp, icon, isLocal, warnings){

    const card = document.createElement('div');

    card.style.background = '#08122f';
    card.style.color = 'white';
    card.style.borderRadius = '16px';
    card.style.padding = '18px';
    card.style.boxShadow = '0 4px 12px rgba(0,0,0,.25)';

    if(isLocal){
        card.style.border = '2px solid #38bdf8';
    }

    const warningsHtml = (warnings || []).map(w => `
        <div class="bwt-warning">
            <span>${w.icon}</span>
            <span>${w.text}</span>
        </div>
    `).join('');

    card.innerHTML = `
        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
        ">

            <div>

                <div style="
                    font-size:20px;
                    font-weight:600;
                    margin-bottom:8px;
                ">
                    ${isLocal ? '📍 ' : ''}${name}
                </div>

                <div style="
                    font-size:32px;
                    margin-bottom:8px;
                ">
                    ${icon}
                </div>

                <div style="
                    font-size:14px;
                    color:#cbd5e1;
                ">
                    💨 ${wind} km/h
                </div>

                <div style="
                    font-size:14px;
                    color:#94a3b8;
                ">
                    ↑${maxTemp}°
                    ↓${minTemp}°
                </div>

            </div>

            <div style="
                font-size:60px;
                font-weight:300;
                line-height:1;
            ">
                ${currentTemp}°
            </div>

        </div>
        ${warningsHtml}
    `;

    return card;

}

function buildMessageCard(text){

    const card = document.createElement('div');

    card.style.background = '#1e293b';
    card.style.color = '#94a3b8';
    card.style.borderRadius = '16px';
    card.style.padding = '18px';
    card.style.fontSize = '14px';
    card.style.textAlign = 'center';

    card.textContent = text;

    return card;

}

async function fetchWeatherFor(lat, lon){

    const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1`;

    const data = await fetch(url).then(r => r.json());

    return {
        currentTemp: Math.round(data.current.temperature_2m),
        wind: Math.round(data.current.wind_speed_10m),
        maxTemp: Math.round(data.daily.temperature_2m_max[0]),
        minTemp: Math.round(data.daily.temperature_2m_min[0]),
        code: data.current.weather_code,
        icon: weatherIcon(data.current.weather_code)
    };

}

async function reverseGeocode(lat, lon){

    try{

        const url =
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;

        const data = await fetch(url).then(r => r.json());

        return data.locality
            || data.city
            || data.principalSubdivision
            || 'My Location';

    }
    catch(err){

        return 'My Location';

    }

}

function getBrowserLocation(){

    return new Promise((resolve, reject) => {

        if(!navigator.geolocation){
            reject(new Error('Geolocation not supported'));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos => resolve({
                lat: pos.coords.latitude,
                lon: pos.coords.longitude
            }),
            err => reject(err),
            {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 600000
            }
        );

    });

}

async function loadLocalCard(panel){

    // Placeholder while we wait on the permission prompt / fetch
    const placeholder = buildMessageCard('Checking your location…');
    panel.appendChild(placeholder);

    try{

        const { lat, lon } = await getBrowserLocation();

        const [weather, name] = await Promise.all([
            fetchWeatherFor(lat, lon),
            reverseGeocode(lat, lon)
        ]);

        const warnings = getWarnings(weather.wind, weather.code, weather.minTemp);

        const card = buildCard(
            name,
            weather.currentTemp,
            weather.wind,
            weather.maxTemp,
            weather.minTemp,
            weather.icon,
            true,
            warnings
        );

        panel.replaceChild(card, placeholder);

    }
    catch(err){

        console.error('Local weather error:', err);

        // err.code === 1 means the user denied the permission prompt
        const message = (err && err.code === 1)
            ? 'Location permission denied — showing default areas only'
            : 'Location unavailable — showing default areas only';

        panel.replaceChild(buildMessageCard(message), placeholder);

    }

}

async function loadWeather(){

    const panel = document.getElementById('bwt-weather');

    panel.innerHTML = '';

    // Local card goes first, and doesn't block the rest of the list
    await loadLocalCard(panel);

    const locations = [
        { name:'Upper Hutt', lat:-41.125, lon:175.070 },
        { name:'Wellington', lat:-41.2866, lon:174.7762 },
        { name:'Porirua', lat:-41.133, lon:174.840 },
        { name:'Hutt Valley', lat:-41.210, lon:174.910 },
        { name:'Kāpiti', lat:-40.900, lon:175.000 },
        { name:'Wairarapa', lat:-41.150, lon:175.450 }
    ];

    for(const loc of locations){

        try{

            const weather = await fetchWeatherFor(loc.lat, loc.lon);
            const warnings = getWarnings(weather.wind, weather.code, weather.minTemp);

            const card = buildCard(
                loc.name,
                weather.currentTemp,
                weather.wind,
                weather.maxTemp,
                weather.minTemp,
                weather.icon,
                false,
                warnings
            );

            panel.appendChild(card);

        }
        catch(err){

            console.error(
                'Weather error:',
                loc.name,
                err
            );

        }

    }

}

loadWeather();

setInterval(loadWeather, 900000);

</script>

</body>
</html>
