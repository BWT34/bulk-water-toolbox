<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1f2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Training Resources</title>

<style>
body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;
    min-height: 100vh;
    color: white;
    position: relative;
}

/* Fixed backdrop layer - pinned behind everything; sized to the real
   visible screen so no white bands appear after pressing Back. */
.bg-fixed {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 100vh;
    min-height: 100dvh;
    z-index: -1;

    background:
        linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
        url('trucks.jpg');

    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}

/* HEADER */
.header {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;

    margin: 12px;
    padding: 12px;

    text-align: center;
}

.header img {
    display: block;
    margin: 0 auto;

    width: 100%;
    max-width: 900px;

    height: auto;
}

@media (max-width: 768px) {
    .header img {
        width: 80%;
        max-width: 350px;
    }
}


/* TITLE BAR */
.title {
    text-align: center;

    margin: 0 12px 12px 12px;
    padding: 14px;

    font-size: 18px;
    font-weight: 600;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    padding: 25px 15px;

    text-align: center;
    text-decoration: none;
    color: white;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.30);

    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.18);
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 42px;
    margin-bottom: 12px;
}

/* Colour icon images - change these two numbers to resize every icon */
.icon img {
    width: 88px;
    height: 88px;
}

@media (max-width: 768px) {
    .icon img {
        width: 72px;
        height: 72px;
    }
}

/* ---- Logo: glossy shine sweep ---- */
.header .logo {
    position: relative;
    display: block;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0,0,0,0.40), 0 0 30px rgba(255,255,255,0.30);
}
.header .logo img {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
    margin: 0;
    animation: none;
    filter: none;
}
.header .logo::after {
    content: "";
    position: absolute;
    top: -20%;
    bottom: -20%;
    width: 22%;
    left: -40%;
    transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.75), rgba(255,255,255,0));
    animation: logoShine 6s ease-in-out infinite;
    pointer-events: none;
}
@keyframes logoShine {
    0%        { left: -40%; }
    35%, 100% { left: 140%; }
}
@media (max-width: 768px) {
    .header .logo { width: 80%; max-width: 350px; }
}
@media (prefers-reduced-motion: reduce) {
    .header .logo::after { animation: none; display: none; }
}

/* ---- Tile / icon lift + soft shadow ---- */
.icon img {
    transition: transform 0.25s ease, filter 0.25s ease;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.30));
}
.card {
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
@media (hover: hover) {
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 40px rgba(0,0,0,0.40);
    }
    .card:hover .icon img {
        transform: translateY(-3px) scale(1.07);
        filter: drop-shadow(0 10px 12px rgba(0,0,0,0.45));
    }
}
.card:active {
    transform: scale(0.97);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
.card:active .icon img {
    transform: translateY(-3px) scale(1.07);
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.45));
}

/* ---- Tap feedback (used on phones, where there is no hover) ---- */
.card.pressed {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 16px 40px rgba(0,0,0,0.40);
    background: rgba(255,255,255,0.26);
}
.card.pressed .icon img {
    transform: translateY(-4px) scale(1.12);
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.45));
}
</style>
</head>

<script>
// Fix white bands after pressing Back: re-layout when restored from cache
window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
        document.body.style.display = 'none';
        document.body.offsetHeight;
        document.body.style.display = '';
    }
});
</script>


<script>
// Lets the press effect show on iPhones
document.addEventListener('touchstart', function(){}, {passive:true});
</script>

<script>
// Tap feedback: show the lift for a moment, then open the page.
(function () {
    var DELAY = 500; // milliseconds - raise for a longer effect
    document.querySelectorAll('a.card').forEach(function (card) {
        card.addEventListener('click', function (e) {
            var href = card.getAttribute('href');
            if (!href || href === '#' || card.hasAttribute('onclick')) return;
            if (card.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            card.classList.add('pressed');
            setTimeout(function () { window.location.href = href; }, DELAY);
        });
    });
    // Clear the effect if the page is restored with the Back button
    window.addEventListener('pageshow', function () {
        document.querySelectorAll('.card.pressed').forEach(function (c) { c.classList.remove('pressed'); });
    });
})();
</script>
