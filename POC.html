<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof of Concept  – Operational Forms</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;

    background: 
        linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
        url('trucks.jpg');

    background-size: cover;
    background-position: center top; /* ✅ better alignment */
    background-repeat: no-repeat;

    
    background-attachment: fixed;
    
    min-height: 100vh; /* ✅ fills screen */

    color: white;
}

/* HEADER */
.header {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;

    margin: 12px;
    padding: 12px;

    text-align: center;
}

.header img {
    display: block;
    margin: 0 auto;

    width: 100%;
    max-width: 900px;

    height: auto;
}

@media (max-width: 768px) {
    .header img {
        width: 80%;
        max-width: 350px;
    }
}


/* TITLE BAR */
.title {
    text-align: center;

    margin: 0 12px 12px 12px;
    padding: 14px;

    font-size: 18px;
    font-weight: 600;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    padding: 25px 15px;

    text-align: center;
    text-decoration: none;
    color: white;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.30);

    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.18);
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 42px;
    margin-bottom: 12px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="header">
    <!-- Replace src with where you upload your logo -->
    <img src="BWT LOGO.jpg" alt="Bulk Water Transport Ltd">
</div>

<div class="title">
    Management – Operational Forms
</div>

<div class="grid">

<a class="card" href="index.html">
    <div class="icon">🏠📁</div>
    Back to main page
</a>

    <a class="card" href="weather.html">
    <div class="icon">🌦️🚛</div>
    Weather
</a>
    
    <a class="card" href="traffic.html">
    <div class="icon">🌦️🚛</div>
    Traffic
</a>
    

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/VehicleServiceSummary">
    <div class="icon">🔍📋</div>
    Vehicle Service Summary
</a>

    <a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/VehicleServiceMaintenanceRecord">
    <div class="icon">🛠️🔩</div>
    Vehicle Service and Maintenace Record
</a>

    <a class="card" href="https://www.cognitoforms.com/bulkwatertransportltd/emergencyresponsefatigueassessment">
    <div class="icon">⏰😴</div>
    Emergency Response Fatigue Assessment
</a>

    <a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/TrainingCourses">
    <div class="icon">📚🎓</div>
    Training Courses
</a>
    

</div>

</body>
</html>
