<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Water Toolbox - POC</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;

    background:
linear-gradient(
    rgba(0,0,0,0.45),
    rgba(0,40,50,0.65)
),
url('trucks.jpg');

    background-size: cover;
    background-position: center top; /* ✅ better alignment */
    background-repeat: no-repeat;

    min-height: 100vh; /* ✅ fills screen */

    color: white;
}

/* HEADER */
.header {
    background: white;
    text-align: center;
    padding: 10px;
}

.header img {
    max-width: 75%;
    height: auto;
}

/* TITLE BAR */
.title {
    text-align: center;

    padding: 16px;

    font-size: 20px;
    font-weight: 600;

    background: rgba(255,255,255,0.15);

    backdrop-filter: blur(10px);

    border-bottom: 1px solid rgba(255,255,255,0.15);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    padding: 25px 15px;

    text-align: center;
    text-decoration: none;
    color: white;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.30);

    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.18);
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 42px;
    margin-bottom: 12px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="header">
    <img src="BWT LOGO.jpg" alt="Bulk Water Transport Ltd">
</div>

<div class="title">
    🏠 Main Toolbox Menu - POC
</div>

<div class="grid">

<a class="card" href="secondary.html">
    <div class="icon">👷🚚</div>
    Drivers – Daily Forms
</a>

<a class="card" href="Thirdly.html">
    <div class="icon">🧑‍💼📊</div>
    Management – Operational Forms
</a>
    
</div>

</body>
</html>
