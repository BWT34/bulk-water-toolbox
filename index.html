<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Water Toolbox</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;

    background: 
        linear-gradient(rgba(0,50,50,0.7), rgba(0,30,30,0.9)),
        url('trucks.jpg');

    background-size: cover;
    background-position: center top; /* ✅ better alignment */
    background-repeat: no-repeat;

    min-height: 100vh; /* ✅ fills screen */

    color: white;
}
#datetime {
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.85;
    font-weight: normal;
}

/* HEADER */
.header {
    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    margin: 12px;
    padding: 8px;

    text-align: center;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);
}

.header img {
    display: block;
    margin: 0 auto;

    width: 100%;
    max-width: 900px;

    height: auto;

    animation: logoGlow 3s ease-in-out infinite;

}

@keyframes logoGlow {

    0%,100% {

        filter:
        drop-shadow(0 0 15px rgba(255,255,255,0.30))
        drop-shadow(0 0 25px rgba(255,255,255,0.20));

    }

    50% {

        filter:
        drop-shadow(0 0 35px rgba(255,255,255,0.80))
        drop-shadow(0 0 60px rgba(255,255,255,0.50))
        drop-shadow(0 0 80px rgba(255,255,255,0.30));

    }

}

/* MOBILE LOGO */

@media (max-width: 768px) {

    .header img {
        width: 80%;
        max-width: 350px;
    }

}
/* TITLE BAR */
.title {
    text-align: center;

    margin: 0 12px 12px 12px;
    padding: 14px;

    font-size: 18px;
    font-weight: 600;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    padding: 25px 15px;

    text-align: center;
    text-decoration: none;
    color: white;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.30);

    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.18);
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 42px;
    margin-bottom: 12px;
}
    .ticker-wrap {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;

    margin-top: 6px;

    color: rgba(255,255,255,0.9);
    font-size: 0.9rem;
    font-weight: 500;
}

.ticker {
    display: inline-block;
    padding-left: 100%;
    animation: tickerScroll 30s linear infinite;
}

@keyframes tickerScroll {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="header">
    <!-- Replace src with where you upload your logo -->
    <img src="BWT LOGO.jpg" alt="Bulk Water Transport Ltd">
</div>

<div class="title">
    🏠 Main Toolbox Menu 🏠
    <div class="ticker-wrap">
    <div class="ticker" id="portalTicker"></div>
</div>
</div>

<div class="grid">

<a class="card" href="secondary.html">
    <div class="icon">👷🚚</div>
    Drivers - Daily Forms
</a>

<a class="card" href="Thirdly.html">
    <div class="icon">🧑‍💼📊</div>
    Management – Operational Forms
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/customerbulkwaterdeliveryorder">
    <div class="icon">💳💵</div>
    Delivery Order
</a> 
    
<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/TruckLeaseHireAgreement">
    <div class="icon">🚚💲</div>
    Hire Agreement Order Form
</a> 
    
    <a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/PPEIssueRegister">
    <div class="icon">🥽🦺</div>
    PPE Supply Register
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/HolidayLeaveRequestForm">
    <div class="icon">🏖️📅</div>
    Leave Request
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/SiteIncidentAndInjuryRegister">
    <div class="icon">🚨🚑</div>
    Site Incident and Injury Register
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/BWTToolboxMeetingMaster">
    <div class="icon">🧰🦺</div>
    ToolBox Meeting - Facilitator Form.
</a>
    
</div> <!-- end grid -->

<script>


    function updatePortalTicker() {

    const now = new Date();

    const dateTime = now.toLocaleString(
        'en-NZ',
        {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            hour: 'numeric',
            minute: '2-digit'
        }
    );

    document.getElementById('portalTicker').innerHTML =
        `🚛 Bulk Water Transport Operations Portal • 🕒 ${dateTime} • `;
}

updatePortalTicker();

setInterval(updatePortalTicker, 60000);
</script>

</body>
</html>
