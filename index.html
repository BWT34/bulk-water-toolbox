<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bulk Water Toolbox</title>

<!-- Home-screen / full-screen app support — see note below on
     "Add to Home Screen" for this to actually take effect -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1f2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BWT Toolbox">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root {
    /* Extra breathing room so content doesn't sit under the notch/
       status bar area once running full-screen from the home screen */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;
    min-height: 100vh;
    color: white;
    position: relative;

    /* Keeps header/content clear of the notch and the home-bar area
       when running full-screen from the home screen */
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    box-sizing: border-box;
}

/* Fixed backdrop layer — sits pinned behind everything. Content
   scrolls normally on top of it; the image itself never moves.
   This is more reliable across mobile browsers than
   background-attachment:fixed, which many phones ignore or
   render with visible jank/dragging. */
.bg-fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    /* Extends past the safe-area edges so the image itself fills
       right behind the notch/status bar instead of leaving a gap */
    height: calc(100vh + var(--safe-top) + var(--safe-bottom));
    margin-top: calc(-1 * var(--safe-top));
    z-index: -1;

    background:
        linear-gradient(
            rgba(0,50,50,0.45),
            rgba(0,30,30,0.60)
        ),
        url('trucks.jpg');

    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}

/* MOBILE SETTINGS */

@media (max-width: 768px) {

    .bg-fixed {

        background:
            linear-gradient(
                rgba(0,50,50,0.45),
                rgba(0,30,30,0.60)
            ),
            url('Trucks2.jpg');

        background-size: 120%;
        background-position: center 10%;
        background-repeat: no-repeat;
    }

    .header img {
        width: 80%;
        max-width: 350px;
    }

}
#datetime {
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.85;
    font-weight: normal;
}

/* HEADER */
.header {
    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    margin: 12px;
    padding: 8px;

    text-align: center;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);
}

.header img {
    display: block;
    margin: 0 auto;

    width: 100%;
    max-width: 900px;

    height: auto;

    animation: logoGlow 3s ease-in-out infinite;

}

@keyframes logoGlow {

    0%,100% {

        filter:
        drop-shadow(0 0 15px rgba(255,255,255,0.30))
        drop-shadow(0 0 25px rgba(255,255,255,0.20));

    }

    50% {

        filter:
        drop-shadow(0 0 35px rgba(255,255,255,0.80))
        drop-shadow(0 0 60px rgba(255,255,255,0.50))
        drop-shadow(0 0 80px rgba(255,255,255,0.30));

    }

}

/* MOBILE LOGO */

@media (max-width: 768px) {

    .header img {
        width: 80%;
        max-width: 350px;
    }

}
/* TITLE BAR */
.title {
    text-align: center;

    margin: 0 12px 12px 12px;
    padding: 14px;

    font-size: 18px;
    font-weight: 600;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: rgba(255,255,255,0.18);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 24px;

    padding: 25px 15px;

    text-align: center;
    text-decoration: none;
    color: white;

    font-size: 16px;
    font-weight: 600;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.30);

    transition: all 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.18);
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 42px;
    margin-bottom: 12px;
}
    .ticker-wrap {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;

    margin-top: 6px;

    color: rgba(255,255,255,0.9);
    font-size: 0.9rem;
    font-weight: 500;
}
    
.notice-box {

    width: 85%;
    max-width: 550px;

    background: rgba(255,255,255,0.15);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    padding: 25px;

    color: white;

    text-align: center;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.35);
}
.notice-overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: rgba(0,0,0,0.70);

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 9999;
}
.notice-box button {

    margin-top: 15px;

    padding: 12px 25px;

    border: none;
    border-radius: 12px;

    background: #007a87;

    color: white;

    cursor: pointer;

    font-size: 16px;
}

.notice-box button:hover {

    background: #0099aa;
}

.ticker {
    display: inline-block;
    padding-left: 100%;
    animation: tickerScroll 30s linear infinite;
}

@keyframes tickerScroll {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<!-- Fixed background layer — stays pinned in place while everything
     else below scrolls normally over the top of it -->
<div class="bg-fixed"></div>

<!-- LOGO -->
<div class="header">
    <!-- Replace src with where you upload your logo -->
    <img src="BWT LOGO.jpg" alt="Bulk Water Transport Ltd">
</div>

<div class="title">
    Main Toolbox Menu
    <div class="ticker-wrap">
    <div class="ticker" id="portalTicker"></div>
</div>
</div>

<div class="grid">

<a class="card" href="secondary.html">
    <div class="icon">🚚</div>
    Drivers Forms
</a>

<a class="card" href="Thirdly.html">
    <div class="icon">📊</div>
    Management Forms
</a>

<a class="card" href="delivery-order.html">
    <div class="icon">💳</div>
    Delivery Order
</a> 
    
<a class="card" href="Hire_Agreements.html">
    <div class="icon">📁</div>
    Hire Forms
</a> 
    
    <a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/PPEIssueRegister">
    <div class="icon">🦺</div>
    PPE Register
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/HolidayLeaveRequestForm">
    <div class="icon">🏖️</div>
    Leave Request
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/SiteIncidentAndInjuryRegister">
    <div class="icon">🚑</div>
    Site Incident/Injury Register
</a>

    <a class="card" href="weather.html">
    <div class="icon">🌦️</div>
    Weather/Traffic Alerts
</a>
        
</div> <!-- end grid -->
    
<!-- NOTICE POPUP -->

<div id="noticeOverlay" class="notice-overlay">

    <div class="notice-box">

        <h2 id="noticeTitle"></h2>

        <p id="noticeMessage"></p>

        <button onclick="closeNotice()">
            Close
        </button>

    </div>

</div>

<script>

function updatePortalTicker() {

    const now = new Date();

    const dateTime = now.toLocaleString(
        'en-NZ',
        {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            hour: 'numeric',
            minute: '2-digit'
        }
    );

    document.getElementById('portalTicker').innerHTML =
        `🚛 Bulk Water Transport Operations Portal • 🕒 ${dateTime} • 📢 Safety First • `;
}

updatePortalTicker();

setInterval(updatePortalTicker, 60000);

let currentNoticeVersion = 0;

async function loadNotice() {

    try {

        const response =
            await fetch('notice.json');

        const notice =
            await response.json();

        if (!notice.enabled) return;

        currentNoticeVersion = notice.version;

        const lastSeenVersion =
            localStorage.getItem('BWTNoticeVersion');

        if (
            lastSeenVersion == notice.version
        ) {
            return;
        }

        document.getElementById('noticeTitle').innerText =
            notice.title;

        document.getElementById('noticeMessage').innerText =
            notice.message;

        document.getElementById('noticeOverlay').style.display =
            'flex';

    }

    catch(error) {

        console.log('notice.json not found');

    }

}

function closeNotice() {

    localStorage.setItem(
        'BWTNoticeVersion',
        currentNoticeVersion
    );

    document.getElementById('noticeOverlay').style.display =
        'none';

}

loadNotice();

</script>
</body>
</html>
