<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Order - Bulk Water Transport</title>
<style>
html { background: #0b2a2a; }   /* shows only for a split second before the picture loads */

body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 80px 20px 20px 20px;
}

/* The truck picture lives on its own layer pinned to the screen,
   so it stays put while the page scrolls (desktop and mobile alike) */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background:
        linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
        url('trucks.jpg');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}
/* stops the picture jumping when the phone's address bar slides away */
@supports (height: 100lvh) {
    body::before { height: 100lvh; }
}

/* MOBILE: same picture swap as before */
@media (max-width: 768px) {
    body::before {
        background:
            linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
            url('Trucks2.jpg');
        background-size: 120%;
        background-position: center 10%;
        background-repeat: no-repeat;
    }
}

.back-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100000;
    padding: 8px 16px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    color: white;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.back-link:hover {
    background: rgba(255,255,255,0.25);
}
.form-wrap {
    max-width: 900px;
    margin: 0 auto;
}
/* Once side panels are visible (matches the 900px breakpoint used by
   both the weather panel and traffic widget), size the form to the
   space actually left between them, with a sensible floor so it
   never gets uncomfortably narrow */
@media (min-width: 900px) {
    .form-wrap {
        width: calc(100vw - 670px);
        max-width: 900px;
        min-width: 480px;
    }
}
</style>
</head>
<body>
<a class="back-link" href="index.html" onclick="if(window.history.length > 1){ history.back(); return false; }">← Back</a>
<div class="form-wrap">
<!-- CognitoForms seamless embed — renders the form directly here -->
<script src="https://www.cognitoforms.com/f/seamless.js" data-key="x8kTpqMjnE6DLzGvDRt_qg" data-form="46"></script>
</div>
<!-- Traffic widget — reads the Delivery Address field once it appears
     above and shows a live traffic-aware ETA from the depot -->
<script src="js/bulk-water-job-route.js?v=4"></script>
<script src="js/bulk-water-quote-popup.js?v=10"></script>
<!-- Weather panel — desktop/tablet only, sits on the left to balance
     the traffic widget on the right -->
<script src="js/bulk-water-weather-panel.js?v=2"></script>
</body>
</html>
