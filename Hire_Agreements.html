<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Water Hire Agreements</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, Arial, sans-serif;

    background: 
        linear-gradient(rgba(0,50,50,0.45), rgba(0,30,30,0.60)),
        url('trucks.jpg');

    background-size: cover;
    background-position: center top; /* ✅ better alignment */
    background-repeat: no-repeat;

    background-attachment: fixed;

    min-height: 100vh; /* ✅ fills screen */

    color: white;
}
/* HEADER */
.header {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;

    margin: 12px;
    padding: 12px;

    text-align: center;
}

.header img {
    display: block;
    margin: 0 auto;

    width: 100%;
    max-width: 900px;

    height: auto;
}

@media (max-width: 768px) {
    .header img {
        width: 80%;
        max-width: 350px;
    }
}
/* TITLE BAR */
.title {
    text-align: center;

    margin: 0 12px 12px 12px;
    padding: 14px;

    font-size: 18px;
    font-weight: 600;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.25);

    color: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD BUTTONS */
.card {
    background: #1b5f69;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    text-decoration: none;
    color: white;
    font-size: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.card:hover {
    background: #237d89;
}

.icon {
    font-size: 28px;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="header">
    <!-- Replace src with where you upload your logo -->
    <img src="BWT LOGO.jpg" alt="Bulk Water Transport Ltd">
</div>

<div class="title">
    Hire Agreements Menu
</div>

<div class="grid">

<a class="card" href="secondary.html">
    <div class="icon">🔂</div>
    Drivers - Daily Forms
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/HireTruckPreStartCheckList">
    <div class="icon">🚀🚛</div>
    Pre‑Hire Checklist
</a>

<a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/HireAgreement">
    <div class="icon">📅🚛</div>
    Truck Hire Agreements
</a>
    
    <a class="card" href="https://www.cognitoforms.com/BulkWaterTransportLtd/HireTruckPostUseCheckList">
    <div class="icon">🏁🚛</div>
    Post‑Hire Checklist
</a>
    
    
</div>

</body>
</html>
